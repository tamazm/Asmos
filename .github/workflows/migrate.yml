name: Prisma Migrate

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/prisma/schema.prisma'
      - 'apps/web/prisma/migrations/**'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Run Prisma Migrate
        if: ${{ secrets.DATABASE_URL != '' }}
        working-directory: ./apps/web
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Skip Prisma Migrate when DATABASE_URL is not configured
        if: ${{ secrets.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; skipping Prisma migrate deploy."
