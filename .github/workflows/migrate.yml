name: Prisma Migrate

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/prisma/schema.prisma'
      - 'apps/web/prisma/migrations/**'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI
    inputs:
      resolve_migration:
        description: >
          Name of a failed migration to mark as rolled back (P3018 recovery)
          before deploying, e.g. 20260826000000_remove_shopify_integration_request.
          Only use this when you've confirmed the named migration applied
          nothing in this database (check the failure output) - leave blank
          for a normal run.
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Resolve failed migration (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resolve_migration != '' }}
        working-directory: ./apps/web
        run: npx prisma migrate resolve --rolled-back "${{ inputs.resolve_migration }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Prisma Migrate
        working-directory: ./apps/web
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
